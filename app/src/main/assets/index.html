const IMG = "https://image.tmdb.org/t/p/";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const tmdb = (path, p = {}, retry = 0) => {
  const u = new URL("https://api.themoviedb.org/3" + path);
  u.searchParams.set("api_key", TMDB_KEY);
  Object.entries(p).forEach(([k, v]) => v !== "" && u.searchParams.set(k, v));
  return fetch(u.toString()).then(r => {
    if (!r.ok) throw new Error("TMDb " + r.status);

    if (retry < 2) {
      return new Promise(res => setTimeout(res, 1200)).then(() => tmdb(path, p, retry + 1));

const SORTS = [["popularity.desc", "Most popular"], ["vote_average.desc", "Top rated"], ["primary_release_date.desc", "Newest"], ["revenue.desc", "Box office"]];
const genreCache = {};
async function browse() {
  try {
    const type = S.view, m = $("#main");
    if (!type || (type !== "movie" && type !== "tv")) return;
    if (!genreCache[type]) {
      try {
        const res = await tmdb(`/genre/${type}/list`);
        genreCache[type] = (res && res.genres) ? res.genres : [];
      } catch (e) {
        genreCache[type] = [];
      }
    }
    const genresList = genreCache[type] || [];
    const sorts = type === "tv" ? SORTS.slice(0, 3).map(s => s[0] === "primary_release_date.desc" ? ["first_air_date.desc", s[1]] : s) : SORTS;
    if (!sorts.some(s => s[0] === S.sort)) S.sort = "popularity.desc";
    m.innerHTML = `<h2>${S.query ? `Results for “${esc(S.query)}”` : type === "movie" ? "All movies" : "All series"}</h2>` +
      (S.query ? "" : `<div class="bar"><select id="sort" aria-label="Sort">${sorts.map(s => `<option value="${s[0]}" ${s[0] === S.sort ? "selected" : ""}>${s[1]}</option>`).join("")}</select></div>
      <div class="bar"><button class="chip ${S.genre ? "" : "on"}" onclick="setGenre('')">All genres</button>${genresList.map(g => `<button class="chip ${S.genre == g.id ? "on" : ""}" onclick="setGenre(${g.id})">${esc(g.name)}</button>`).join("")}</div>`) +
      `<div class="grid" id="grid"></div><p class="msg" id="info"></p><button class="more" id="more" hidden onclick="more()">Load more</button>`;
    if ($("#sort")) $("#sort").onchange = e => { S.sort = e.target.value; S.page = 1; browse() };
    fetchPage(false);
  } catch(e) {
    console.error("browse error:", e);
  }
}
function setGenre(g) { S.genre = g; S.page = 1; browse() }
async function fetchPage(append) {
  const type = S.view;
  try {
    let d;
    if (S.query) d = await tmdb("/search/" + type, { query: S.query, page: S.page });
    else {
      const p = { page: S.page, sort_by: S.sort, with_genres: S.genre };
      if (S.sort === "vote_average.desc") p["vote_count.gte"] = 300;
      if (type === "movie" && S.sort.startsWith("primary")) p["primary_release_date.lte"] = today();
      if (type === "tv" && S.sort.startsWith("first_air")) p["first_air_date.lte"] = today();
      d = await tmdb("/discover/" + type, p);
    }
    const html = d.results.map(i => card(i, type)).join("");
    $("#grid").insertAdjacentHTML(append ? "beforeend" : "afterbegin", html);
    const pages = Math.min(d.total_pages, 500);
    $("#info").textContent = `${d.total_results.toLocaleString()} titles found · page ${S.page} of ${pages.toLocaleString()}`;
    $("#more").hidden = S.page >= pages;
  } catch (e) { $("#info").textContent = "Could not load titles (" + e.message + "). Check internet connection." }
}

}

async function loadMatches(sel, o, limit = 0, quiet, retry = 0) {
  const el = $(sel); if (!el) return;
  const day = n => new Date(Date.now() + n * 864e5).toISOString().slice(0, 10);
  let [a, b] = o.range === "week" ? [day(0), day(7)] : o.range === "results" ? [day(-3), day(0)] : [day(0), day(1)];
  if (!quiet) el.innerHTML = `<p class="msg">Loading matches…</p>`;
  try {
    const u = new URL("https://api.football-data.org/v4/matches");
    u.searchParams.set("dateFrom", a); u.searchParams.set("dateTo", b);
    if (o.comp) u.searchParams.set("competitions", o.comp);
    const r = await fetch(u.toString(), {
      headers: { "X-Auth-Token": FOOTBALL_DATA_TOKEN }
    });
    if (!r.ok) throw new Error(r.status === 429 ? "Rate limit reached, wait a minute" : "football-data " + r.status);
    let ms = (await r.json()).matches || [];
    if (o.range === "live") ms = ms.filter(x => ["IN_PLAY", "PAUSED", "LIVE"].includes(x.status));
    if (o.range === "today") ms = ms.filter(x => x.utcDate.slice(0, 10) === day(0) || ["IN_PLAY", "PAUSED"].includes(x.status));
    if (o.range === "results") ms = ms.filter(x => x.status === "FINISHED").reverse();
    if (limit) ms = ms.slice(0, limit);
    el.innerHTML = ms.length ? ms.map(match).join("") : `<p class="msg">No matches for this filter. Try another league or time range.</p>`;
  } catch (e) {
    if (retry < 2) {
      setTimeout(() => loadMatches(sel, o, limit, quiet, retry + 1), 1500);
      return;
    }
    el.innerHTML = `<p class="msg">Matches will refresh automatically when live.</p>`;
  }
}

function match(x) {
  const live = ["IN_PLAY", "PAUSED"].includes(x.status), done = x.status === "FINISHED", ft = x.score?.fullTime || {};
  const d = new Date(x.utcDate);
  const mid = (live || done) ? `${ft.home ?? 0} - ${ft.away ?? 0}<small class="${live ? "live" : ""}">${live ? "LIVE" : "Full time"}</small>`
    : `${d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}<small>${d.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" })}</small>`;
  return `<div class="match"><div class="t"><img src="${x.homeTeam.crest || ""}" alt=""><b>${esc(x.homeTeam.shortName || x.homeTeam.name)}</b></div>
   <div class="score">${mid}</div><div class="t"><b>${esc(x.awayTeam.shortName || x.awayTeam.name)}</b><img src="${x.awayTeam.crest || ""}" alt=""></div>
   <div style="grid-column:1/-1"><small style="color:var(--mute)">${esc(x.competition.name)}</small>${live ? `<button class="watch" onclick="watchLive('${esc(x.homeTeam.name)}','${esc(x.awayTeam.name)}')">Watch live</button>` : ""}</div></div>`;
}

/* ---------- Downloads View & Production IndexedDB Chunked Download Engine ---------- */
const DB_NAME = "FilmBoxDB";
const STORE_NAME = "videos";

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME);
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}

async function saveChunkToDb(id, chunk, offset) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const store = tx.objectStore(STORE_NAME);
    const req = store.get(String(id));
    req.onsuccess = e => {
      let existing = e.target.result;
      if (!existing) {
        existing = [];
      }
      existing.push({ offset, data: chunk });
      store.put(existing, String(id));
    };
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e.target.error);
  });
}

async function assembleVideoBlob(id) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readonly");
    const store = tx.objectStore(STORE_NAME);
    const req = store.get(String(id));
    req.onsuccess = e => {
      const chunks = e.target.result;
      if (!chunks || !Array.isArray(chunks)) {
        resolve(null);
        return;
      }
      chunks.sort((a, b) => a.offset - b.offset);
      const blob = new Blob(chunks.map(c => c.data), { type: "video/mp4" });
      resolve(blob);
    };
    req.onerror = e => reject(e.target.error);
  });
}

async function deleteVideoFromDb(id) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const store = tx.objectStore(STORE_NAME);
    store.delete(String(id));
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e.target.error);
  });
}

async function verifyDownloadsIntegrity() {
  try {
    let raw = localStorage.getItem("mb_offline_downloads") || "[]";
    let list = JSON.parse(raw);
    let changed = false;
    for (let item of list) {
      if (item.status === "COMPLETED") {
        const blob = await assembleVideoBlob(item.id);
        if (!blob || blob.size <= 0) {
          item.status = "FAILED";
          changed = true;
          console.error("FilmBoxDownload", "Integrity check failed: File missing or 0 bytes for ID:", item.id);
        }
      }
    }
    if (changed) {
      localStorage.setItem("mb_offline_downloads", JSON.stringify(list));
    }
  } catch (err) {
    console.error("FilmBoxDownload", "Integrity check error:", err);
  }
}

const activeDownloads = {};

function getDownloadCredits() {
  const raw = localStorage.getItem("mb_download_credits");
  if (raw === null) {
    localStorage.setItem("mb_download_credits", "3");
    return 3;
  }
  return parseInt(raw, 10);
}

function downloadView() {
  const m = $("#main");

  let list = [];
  try { list = JSON.parse(raw); } catch(e) {}
  const credits = getDownloadCredits();

  m.innerHTML = `<h2>💾 Offline Saved Downloads (${list.length}) · <small style="color:var(--gold)">${credits}/3 Free Credits Left</small></h2>
    <div id="dlGrid" class="grid"></div>`;

  const grid = $("#dlGrid");
  if (list.length === 0) {
    grid.innerHTML = `<p class="msg" style="grid-column:1/-1;padding:40px 0;text-align:center">No saved downloads yet. Tap "📥 Download" inside any title! (${credits}/3 Free Credits remaining)</p>`;
    return;
  }

  grid.innerHTML = list.map(item => `
    <div class="card" onclick="playOffline(${item.id})">
      <img src="${item.poster}" alt="${esc(item.title)}">
      <div><b>${esc(item.title)}</b><br><small style="color:${item.status === 'COMPLETED' ? 'var(--pitch)' : '#ff4d4d'}">${item.status || 'QUEUED'} · ${item.percent || 0}% (${item.realSizeMB || item.estMB || 850} MB)</small></div>
      <div style="display:flex;gap:6px;margin:8px">
        ${item.status === 'DOWNLOADING' ? `<button onclick="event.stopPropagation();cancelDownload(${item.id})" style="padding:4px 8px;border-radius:8px;background:#f59e0b;color:#fff;border:0;cursor:pointer;font-size:11px">Pause</button>` : ''}
        ${item.status === 'PAUSED' || item.status === 'FAILED' ? `<button onclick="event.stopPropagation();startRealDownload()" style="padding:4px 8px;border-radius:8px;background:var(--accent);color:#000;border:0;cursor:pointer;font-size:11px">Resume</button>` : ''}
        <button onclick="event.stopPropagation();removeDownload(${item.id})" style="padding:4px 8px;border-radius:8px;background:#ff4d4d;color:#fff;border:0;cursor:pointer;font-size:11px">Delete</button>
      </div>
    </div>
  `).join("");
}

async function playOffline(id) {
  try {
    const blob = await assembleVideoBlob(id);
    if (blob && blob.size > 0) {
      const blobUrl = URL.createObjectURL(blob);
      showPlayer("Offline Playback", blobUrl);
      return;
    }
  } catch(e) {
    console.error("FilmBoxDownload", "Error playing offline video:", e);
  }
  alert("Offline file not found or incomplete. Please reconnect to network or re-download.");
}

function cancelDownload(id) {
  if (activeDownloads[id]) {
    activeDownloads[id].abort();
    delete activeDownloads[id];
  }
  let raw = localStorage.getItem("mb_offline_downloads") || "[]";
  let list = JSON.parse(raw);
  let item = list.find(x => x.id === id);
  if (item) {
    item.status = "PAUSED";
    localStorage.setItem("mb_offline_downloads", JSON.stringify(list));
    downloadView();
  }
}

async function startRealDownload() {
  if (!CUR || !CUR.id) return;
  const credits = getDownloadCredits();
  if (credits <= 0) {
    openDownloadPassModal();
    return;
  }

  const id = CUR.id;
  const title = CUR.title;
  const posterPath = CUR.poster_path;
  const estMB = CUR.estMB || 850;
  const streamUrl = getDirectStreamUrl(id);

  console.log("FilmBoxDownload", "URL being downloaded:", streamUrl, "Storage Location: IndexedDB -> FilmBoxDB");

  try {
    if (navigator.storage && navigator.storage.persist) {
      await navigator.storage.persist();
    }
    const estimate = await navigator.storage?.estimate();
    if (estimate && estimate.quota && estimate.usage) {
      const freeBytes = estimate.quota - estimate.usage;
      if (freeBytes < 50 * 1024 * 1024) {
        alert("Not enough storage space on device.");
        return;
      }
    }
  } catch (err) {
    console.error("FilmBoxDownload", "Storage estimate error:", err);
  }

  let raw = localStorage.getItem("mb_offline_downloads") || "[]";
  let list = JSON.parse(raw);
  let existing = list.find(x => x.id === id);
  let downloadedBytes = existing?.downloadedBytes || 0;

  const controller = new AbortController();
  activeDownloads[id] = controller;

  try {
    if (!existing) {
      list.push({
        id: id,
        type: CUR.type || "movie",
        title: title,
        poster: poster(posterPath),
        status: "DOWNLOADING",
        percent: 0,
        estMB: estMB,
        downloadedBytes: 0
      });
      localStorage.setItem("mb_offline_downloads", JSON.stringify(list));
      const newCredits = credits - 1;
      localStorage.setItem("mb_download_credits", String(newCredits));
    } else {
      existing.status = "DOWNLOADING";
      localStorage.setItem("mb_offline_downloads", JSON.stringify(list));
    }
    downloadView();

    const headers = {};
    if (downloadedBytes > 0) {
      headers["Range"] = `bytes=${downloadedBytes}-`;
    }

    let res;
    try {
      res = await fetch(streamUrl, { headers, signal: controller.signal });
    } catch (netErr) {
      throw new Error("Network error or CORS block: " + netErr.message);
    }

    if (!res.ok && res.status !== 206) {
      throw new Error("Server error or CORS restriction: " + res.status);
    }

    const contentRange = res.headers.get("content-range");
    let totalBytes = parseInt(res.headers.get("content-length") || "15000000", 10);
    if (contentRange) {
      const parts = contentRange.split("/");
      if (parts.length > 1) {
        totalBytes = parseInt(parts[1], 10) || totalBytes;
      }
    }

    const reader = res.body.getReader();
    let chunkOffset = downloadedBytes;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      await saveChunkToDb(id, value, chunkOffset);
      chunkOffset += value.length;
      downloadedBytes += value.length;

      const pct = Math.min(100, Math.round((downloadedBytes / totalBytes) * 100));
      console.log("FilmBoxDownload", "Bytes received so far:", downloadedBytes, "Total bytes:", totalBytes, "Percent:", pct + "%");

      let list = JSON.parse(localStorage.getItem("mb_offline_downloads") || "[]");
      let item = list.find(x => x.id === id);
      if (item) {
        item.percent = pct;
        item.downloadedBytes = downloadedBytes;
        localStorage.setItem("mb_offline_downloads", JSON.stringify(list));
      }
    }

    const finalBlob = await assembleVideoBlob(id);
    if (!finalBlob || finalBlob.size <= 0) {
      throw new Error("Assembled file is empty (0 bytes).");
    }

    let list = JSON.parse(localStorage.getItem("mb_offline_downloads") || "[]");
    let item = list.find(x => x.id === id);
    if (item) {
      item.status = "COMPLETED";
      item.percent = 100;
      item.realSizeMB = (finalBlob.size / (1024 * 1024)).toFixed(1);
      localStorage.setItem("mb_offline_downloads", JSON.stringify(list));
    }

    console.log("FilmBoxDownload", "Final saved size:", finalBlob.size, "Storage Location: IndexedDB -> FilmBoxDB");
    alert(`📥 Download Complete! "${title}" (${(finalBlob.size / (1024 * 1024)).toFixed(1)} MB) saved successfully.`);
    downloadView();
  } catch (err) {
    if (err.name === "AbortError") {
      console.log("FilmBoxDownload", "Download paused for:", title);
      let list = JSON.parse(localStorage.getItem("mb_offline_downloads") || "[]");
      let item = list.find(x => x.id === id);
      if (item) {
        item.status = "PAUSED";
        localStorage.setItem("mb_offline_downloads", JSON.stringify(list));
        downloadView();
      }
    } else {
      console.error("FilmBoxDownload", "Download FAILED for:", title, err.message);
      let list = JSON.parse(localStorage.getItem("mb_offline_downloads") || "[]");
      let item = list.find(x => x.id === id);
      if (item) {
        item.status = "FAILED";
        localStorage.setItem("mb_offline_downloads", JSON.stringify(list));
      }
      alert(`Download failed for "${title}": ${err.message}`);
      downloadView();
    }
  } finally {
    delete activeDownloads[id];
  }
}

async function removeDownload(id) {
  try {
    if (activeDownloads[id]) {
      activeDownloads[id].abort();
      delete activeDownloads[id];
    }
    await deleteVideoFromDb(id);
    let raw = localStorage.getItem("mb_offline_downloads") || "[]";
    let list = JSON.parse(raw).filter(x => x.id !== id);
    localStorage.setItem("mb_offline_downloads", JSON.stringify(list));
    downloadView();
  } catch(e) {
    console.error("FilmBoxDownload", "Error removing download:", e);
  }
}

function myListView() {
  const m = $("#main");
  let raw = localStorage.getItem("mb_mylist") || "[]";
  let list = [];
  try { list = JSON.parse(raw); } catch(e) {}

  m.innerHTML = `<h2>❤️ My Favorite List (${list.length})</h2>
    <div id="mlGrid" class="grid"></div>`;

  const grid = $("#mlGrid");
  if (list.length === 0) {
    grid.innerHTML = `<p class="msg" style="grid-column:1/-1;padding:40px 0;text-align:center">Your favorite list is empty. Tap "❤️ My List" inside any movie to save it here!</p>`;
    return;
  }

  grid.innerHTML = list.map(item => `
    <div class="card" onclick="quickPlay(${item.id},'${item.type}','${esc(item.title)}')">
      <img src="${item.poster}" alt="${esc(item.title)}">
      <div><b>${esc(item.title)}</b><br><small style="color:var(--accent)">Saved in My List ❤️</small></div>
      <button onclick="event.stopPropagation();removeFromMyList(${item.id})" style="margin:8px;padding:4px 8px;border-radius:8px;background:#ff4d4d;color:#fff;border:0;cursor:pointer;font-size:11px">Remove</button>

function toggleMyListCurrent() {
  if (!CUR || !CUR.id) return;
  try {
    let raw = localStorage.getItem("mb_mylist") || "[]";
    let list = JSON.parse(raw);
    if (!list.some(x => x.id === CUR.id)) {
      list.push({
        id: CUR.id,
        type: CUR.type || "movie",
        title: CUR.title || "Movie",
        poster: poster(CUR.poster_path)
      });
      localStorage.setItem("mb_mylist", JSON.stringify(list));
      alert(`❤️ Added "${CUR.title}" to My List!`);
    } else {
      list = list.filter(x => x.id !== CUR.id);
      localStorage.setItem("mb_mylist", JSON.stringify(list));
      alert(`Removed "${CUR.title}" from My List.`);
    }
  } catch(e) {}
}

function removeFromMyList(id) {
  try {
    let raw = localStorage.getItem("mb_mylist") || "[]";
    let list = JSON.parse(raw).filter(x => x.id !== id);
    localStorage.setItem("mb_mylist", JSON.stringify(list));
    myListView();
  } catch(e) {}
}

function shareCurrent() {
  if (!CUR || !CUR.title) return;
  if (navigator.share) {
    navigator.share({
      title: CUR.title,
      text: `Check out "${CUR.title}" on Film Box!`,
      url: window.location.href
    }).catch(e => {});
  } else {
    alert(`🔗 Share link for "${CUR.title}":\nhttps://filmbox.ke/watch/${CUR.id}`);
  }
}

    <div class="plan" data-id="p13" onclick="pickPlan('p13')"><small style="color:#38bdf8;font-weight:800">Lifetime VIP</small><b style="color:#fbbf24;font-size:20px;font-weight:900">KES 9999</b><small style="color:#34d399;font-weight:700">Permanent Full Access</small></div>
  </div></div>`;
}

function pickPlan(id) {
  PLAN = id;
  document.querySelectorAll(".plan").forEach(p => p.classList.toggle("on", p.dataset.id === id));
  switchPayTab(currentPayMethod);
}

let paypalPollTimer = null;

function stopPayPalPolling() {
  if (paypalPollTimer) {
    clearInterval(paypalPollTimer);
    paypalPollTimer = null;
  }
}

async function payWithPayPal() {
  const usdAmount = PLAN_PRICES_USD[PLAN] || "1.90";
  const st = $("#pst");
  st.innerHTML = `<div class="loader-ring" style="width:30px;height:30px;margin:10px auto"></div><p style="color:#38bdf8;font-weight:bold">Connecting to PayPal REST API ($${usdAmount} USD)...</p>`;

  const handleOrderCreated = (resStr) => {
    try {
      const res = typeof resStr === 'string' ? JSON.parse(resStr) : resStr;
      const orderId = res.id;
      if (!orderId) {
        st.innerHTML = `<p style="color:#ff4d4d;font-weight:bold">PayPal Error: ${esc(res.error || "Could not initialize Order")}</p>`;
        return;
      }

      let approveUrl = `https://www.paypal.com/checkoutnow?token=${orderId}`;
      if (res.links && Array.isArray(res.links)) {
        const linkObj = res.links.find(l => l.rel === "approve" || l.rel === "payer-action");
        if (linkObj && linkObj.href) approveUrl = linkObj.href;
      }

      st.innerHTML = `<div style="background:#151530;border:1px solid #2563eb;padding:16px;border-radius:14px;margin:10px auto;max-width:400px;text-align:center">
        <p style="color:#38bdf8;font-weight:bold;margin-bottom:8px">PayPal Order Created (#${esc(orderId)})!</p>
        <p style="color:#f5f3ff;font-size:13px;margin-bottom:12px">Approve the $${usdAmount} USD payment on PayPal:</p>
        <a href="${approveUrl}" target="_blank" onclick="window.open('${approveUrl}', '_blank'); return false;" style="display:inline-block;padding:12px 24px;background:#2563eb;color:#fff;border-radius:20px;font-weight:bold;text-decoration:none;margin-bottom:10px">Approve Payment on PayPal ↗</a>
        <br>
        <button class="vip" onclick="capturePayPalOrder('${orderId}')" style="background:#10b981;color:#000;margin-top:6px;font-weight:bold">Complete & Activate VIP ⚡</button>
      </div>`;

      // Auto-open PayPal Checkout window
      try {
        window.open(approveUrl, '_blank');
      } catch(e) {}

      // Auto-poll PayPal Order status every 3 seconds
      stopPayPalPolling();
      let attempts = 0;
      paypalPollTimer = setInterval(() => {
        attempts++;
        capturePayPalOrder(orderId, true);
        if (attempts >= 40) stopPayPalPolling();
      }, 3000);

    } catch(e) {
      st.innerHTML = `<p style="color:#ff4d4d">PayPal processing error.</p>`;
    }
  };

  window.onPayPalOrderCreated = handleOrderCreated;

  if (typeof AndroidPayPal !== 'undefined' && AndroidPayPal.createPayPalOrder) {
    AndroidPayPal.createPayPalOrder(usdAmount, "onPayPalOrderCreated");
  } else {
    setTimeout(() => {
      onPayPalOrderCreated(JSON.stringify({ id: "PAYID_MOCK_" + Date.now(), status: "CREATED" }));
    }, 1000);
  }
}

function capturePayPalOrder(orderId, isSilent) {
  const st = $("#pst");
  if (!isSilent && st) {
    st.innerHTML = `<div class="loader-ring" style="width:30px;height:30px;margin:10px auto"></div><p style="color:#00ff88;font-weight:bold">Verifying payment with PayPal...</p>`;
  }

  const handleOrderCaptured = (resStr) => {
    try {
      const res = typeof resStr === 'string' ? JSON.parse(resStr) : resStr;
      if (res.status === "COMPLETED" || res.id) {
        stopPayPalPolling();
        const dur = PLAN_DURATIONS_MS[PLAN] || (7 * 24 * 3600 * 1000);
        const expiry = Date.now() + dur;
        localStorage.setItem("mb_vip_expiry", String(expiry));
        checkVipActive();
        const md = $("#modal");
        if (md) {
          md.innerHTML = `<div class="sheet" style="padding:40px 20px;text-align:center">
            <div style="font-size:48px;margin-bottom:12px">🎉</div>
            <h2 style="color:#00ff88;margin-bottom:8px">PayPal Payment Confirmed!</h2>
            <p style="color:var(--text);font-size:15px;margin-bottom:20px">Your VIP Pass ($${PLAN_PRICES_USD[PLAN]} USD) has been successfully activated. Enjoy unlimited streaming!</p>
            <button class="play" onclick="closeM()" style="background:var(--pitch);color:#000">Start Watching Now ▶</button>
          </div>`;
        }
      } else if (!isSilent && st) {
        const errMsg = res.error || res.errorMessage || (res.details && res.details[0] ? res.details[0].description : "Payment approval pending.");
        st.innerHTML = `<div style="background:#151530;border:1px solid #ff4d4d;padding:12px;border-radius:12px;margin:10px auto;max-width:400px">
          <p style="color:#ff4d4d;font-weight:bold;margin-bottom:6px">PayPal Capture Notice:</p>
          <p style="color:#f5f3ff;font-size:13px;margin-bottom:8px">${esc(errMsg)}</p>
          <button class="vip" onclick="payWithPayPal()" style="background:var(--accent);color:#000;font-size:12px">Retry PayPal Checkout 🔄</button>
        </div>`;
      }
    } catch(e) {
      if (!isSilent && st) st.innerHTML = `<p style="color:#ff4d4d">PayPal capture error.</p>`;
    }
  };

  window.onPayPalOrderCaptured = handleOrderCaptured;

  if (typeof AndroidPayPal !== 'undefined' && AndroidPayPal.capturePayPalOrder) {
    AndroidPayPal.capturePayPalOrder(orderId, "onPayPalOrderCaptured");
  } else {
    setTimeout(() => {
      onPayPalOrderCaptured(JSON.stringify({ id: orderId, status: "COMPLETED" }));
    }, 1200);
  }
}

function pickPlan(id) { PLAN = id; document.querySelectorAll(".plan").forEach(p => p.classList.toggle("on", p.dataset.id === id)) }

async function pay() {
  const st = $("#pst"); if (!PLAN) return alert("Please select a VIP plan first.");
  const ph = $("#ph").value.trim();
  if (!ph || ph.length < 9) return alert("Please enter a valid M-Pesa registered phone number.");

  const price = PLAN_PRICES[PLAN] || 250;

  // Render Dedicated Full-Screen STK Loading Spinner Screen
  const md = $("#modal");
  md.innerHTML = `<div class="sheet" style="padding:40px 20px;text-align:center">
    <div class="loader-ring" style="margin:20px auto"></div>
    <h2 style="margin:16px 0 8px;color:#00ff88">📱 M-Pesa Prompt Dispatched!</h2>
    <p style="color:var(--text);font-size:15px;line-height:1.6;max-width:480px;margin:0 auto 20px">
      An M-Pesa authorization prompt has been sent to <b style="color:#00ff88">${esc(ph)}</b>.<br>
      Please check your phone screen and enter your M-Pesa PIN to complete payment.
    </p>
    <div style="background:#0b0b1a;border:1px solid #2a2a55;padding:12px;border-radius:12px;font-size:13px;color:var(--gold);margin-bottom:20px">
      ⏳ Verifying transaction status with Safaricom... Keep this screen open.
    </div>
    <button class="vip" onclick="closeM()" style="background:#2a2a55;color:#fff;box-shadow:none">Cancel / Close</button>
    <p class="msg" id="pst" style="margin-top:12px"></p>
  </div>`;

  if (typeof AndroidKYC !== 'undefined' && AndroidKYC.triggerMpesaSTKPush) {
    AndroidKYC.triggerMpesaSTKPush(ph, String(price), "onMpesaSTKResponse");
  } else if (typeof AndroidMpesa !== 'undefined' && AndroidMpesa.triggerMpesaSTKPush) {
    AndroidMpesa.triggerMpesaSTKPush(ph, String(price), "onMpesaSTKResponse");
  } else {
    setTimeout(() => {
      onMpesaSTKResponse(JSON.stringify({ ResponseCode: "0", CheckoutRequestID: "CHK_12345" }));
    }, 1500);
  }
}

let stkPollTimer = null;

function stopMpesaPolling() {
  if (stkPollTimer) {
    clearInterval(stkPollTimer);
    stkPollTimer = null;
  }
}

function startMpesaPolling(checkoutRequestId) {
  stopMpesaPolling();
  if (!checkoutRequestId) return;

  let attempts = 0;
  const maxAttempts = 20;

  stkPollTimer = setInterval(() => {
    attempts++;
    const pst = $("#pst");
    if (pst) pst.textContent = `⏳ Verifying payment with Safaricom (${attempts}/${maxAttempts})...`;

    const handleQueryResponse = (resStr) => {
      try {
        const res = typeof resStr === 'string' ? JSON.parse(resStr) : resStr;
        const resCode = String(res.ResultCode !== undefined ? res.ResultCode : (res.resultCode !== undefined ? res.resultCode : "1037"));

        if (resCode === "0") {
          stopMpesaPolling();
          const dur = PLAN_DURATIONS_MS[PLAN] || (7 * 24 * 3600 * 1000);
          const expiry = Date.now() + dur;
          localStorage.setItem("mb_vip_expiry", String(expiry));
          checkVipActive();
          const md = $("#modal");
          if (md) {
            md.innerHTML = `<div class="sheet" style="padding:40px 20px;text-align:center">
              <div style="font-size:48px;margin-bottom:12px">🎉</div>
              <h2 style="color:#00ff88;margin-bottom:8px">Payment Confirmed!</h2>
              <p style="color:var(--text);font-size:15px;margin-bottom:20px">Your VIP Pass has been successfully activated. Enjoy unlimited streaming!</p>
              <button class="play" onclick="closeM()" style="background:var(--pitch);color:#000">Start Watching Now ▶</button>
            </div>`;
          }
        } else if (resCode === "1" || resCode === "1032" || resCode === "1001") {
          stopMpesaPolling();
          const md = $("#modal");
          const reason = resCode === "1" ? "Insufficient M-Pesa Balance" : (resCode === "1032" ? "Payment Cancelled on Phone" : "Transaction Failed");
          if (md) {
            md.innerHTML = `<div class="sheet" style="padding:40px 20px;text-align:center">
              <div style="font-size:48px;margin-bottom:12px">❌</div>
              <h2 style="color:#ff4d4d;margin-bottom:8px">Payment Failed</h2>
              <p style="color:var(--text);font-size:14px;margin-bottom:20px">${esc(reason)}. VIP Pass was NOT activated.</p>
              <button class="vip" onclick="openVip()" style="background:var(--accent);color:#000">Try Again 🔄</button>
            </div>`;
          }
        }
      } catch(e) {}
    };

    window.onMpesaQueryResponse = handleQueryResponse;

    if (typeof AndroidKYC !== 'undefined' && AndroidKYC.queryMpesaSTKStatus) {
      AndroidKYC.queryMpesaSTKStatus(checkoutRequestId, "onMpesaQueryResponse");
    } else if (typeof AndroidMpesa !== 'undefined' && AndroidMpesa.queryMpesaSTKStatus) {
      AndroidMpesa.queryMpesaSTKStatus(checkoutRequestId, "onMpesaQueryResponse");
    }

    if (attempts >= maxAttempts) {
      stopMpesaPolling();
      const pst = $("#pst");
      if (pst) pst.textContent = "STK verification timed out. If money was deducted, click 'Go VIP' to retry.";
    }
  }, 3000);
}

window.onMpesaSTKResponse = function(responseStr) {
  try {
    const res = typeof responseStr === 'string' ? JSON.parse(responseStr) : responseStr;
    const code = String(res.ResponseCode !== undefined ? res.ResponseCode : (res.responseCode !== undefined ? res.responseCode : "1"));
    if (code === "0" || res.ResponseCode === "0") {
      const checkoutReqId = res.CheckoutRequestID || res.checkoutRequestID;
      startMpesaPolling(checkoutReqId);
    } else {
      const pst = $("#pst");
      if (pst) pst.textContent = "M-Pesa Error: " + (res.errorMessage || res.ResponseDescription || "Transaction rejected.");
    }
  } catch(e) {
    const pst = $("#pst");
    if (pst) pst.textContent = "M-Pesa processing error.";
  }
};

window.addEventListener("message", e => {
  if (e.data === "videoEnded" || e.data === "ended") {
    playNextEpisode();
  }
});

let vipRenewBannerTimer = null;

function closeRenewBanner() {
  const b = $("#vipRenewBanner");
  if (b) b.remove();
}

function showVipRenewBanner() {
  closeRenewBanner();
  if (checkVipActive()) return;

  const banner = document.createElement("div");
  banner.id = "vipRenewBanner";
  banner.innerHTML = `<div style="position:fixed;bottom:20px;left:20px;right:20px;z-index:99999;background:linear-gradient(135deg, #1e1b4b, #0f172a);border:2px solid var(--accent);border-radius:16px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 10px 30px rgba(0,0,0,0.8);gap:10px">
    <div>
      <b style="color:var(--gold);font-size:14px;display:block">⭐ VIP Pass Expired!</b>
      <small style="color:#cbd5e1;font-size:12px">Renew your pass for smooth, uninterrupted streaming.</small>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="vip" onclick="openVip();closeRenewBanner()" style="padding:8px 14px;font-size:12px;font-weight:bold">Renew VIP ⚡</button>
      <button onclick="closeRenewBanner()" style="background:none;border:0;color:#fff;font-size:18px;cursor:pointer;padding:4px">✕</button>
    </div>
  </div>`;
  document.body.appendChild(banner);
}

function initVipRenewTimer() {
  if (vipRenewBannerTimer) clearInterval(vipRenewBannerTimer);
  vipRenewBannerTimer = setInterval(() => {
    if (!checkVipActive()) {
      showVipRenewBanner();
    }
  }, 600000);
}

initVipRenewTimer();

document.addEventListener("DOMContentLoaded", () => {
  checkVipActive();
  render();
});
if (document.readyState === "complete" || document.readyState === "interactive") {
  checkVipActive();
  render();
}
</script>
