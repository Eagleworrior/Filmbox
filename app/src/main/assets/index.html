<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Film Box - 100% Ad-Free Direct Cinema & Sports</title>
<link rel="dns-prefetch" href="https://vidsrc.to">

<style>
:root{--bg:#14110f;--panel:#201b18;--line:#352e29;--text:#f3ece4;--mute:#a79c91;--accent:#f2b134;--pitch:#2fa36b;--accent2:#7c5cff;--gold:#ffc23c}
*{box-sizing:border-box;margin:0}
html,body{margin:0!important;padding:0!important;width:100%!important;min-height:100vh!important;background:var(--bg)!important;color:var(--text)!important;font:15px/1.5 "Trebuchet MS",Verdana,sans-serif!important;padding-bottom:100px!important;overflow-x:hidden!important}
header{position:sticky;top:0;z-index:99;background:rgba(11, 11, 26, 0.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:max(12px, env(safe-area-inset-top)) 16px 12px 16px;display:flex;flex-direction:column;gap:10px}
.top-bar{display:flex;align-items:center;justify-content:space-between;position:relative;width:100%}
.logo{position:absolute;left:50%;transform:translateX(-50%);font:900 24px Georgia,serif;background:linear-gradient(90deg,#ffc23c,#ff4d8d,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer;white-space:nowrap}
.search-row{width:100%;display:flex;justify-content:center}
.search-row input{width:100%;max-width:500px;padding:10px 18px;font-size:14px;font-weight:600;border-radius:25px;background:rgba(21, 21, 48, 0.85);border:1.5px solid rgba(56, 189, 248, 0.4);color:#fff;box-shadow:0 4px 15px rgba(0, 0, 0, 0.3);transition:all 0.3s ease}
.search-row input:focus{border-color:var(--accent);box-shadow:0 0 15px rgba(255, 77, 141, 0.4);outline:none}
.hidden{display:none!important;opacity:0!important;pointer-events:none!important;visibility:hidden!important}
main{padding:20px;max-width:1200px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.row{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px}
.row .card{flex:0 0 150px}
.card{cursor:pointer;background:rgba(21,21,48,0.75);backdrop-filter:blur(12px);border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.12);box-shadow:0 8px 20px rgba(0,0,0,0.4);transition:transform 0.25s,box-shadow 0.25s,border-color 0.25s}
.card:hover{transform:translateY(-6px) scale(1.02);border-color:var(--accent);box-shadow:0 12px 30px rgba(255,77,141,0.35)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#2a2420}
.card div{padding:8px 10px;font-size:13px}
.card small{color:var(--mute)}
h2{font:800 22px Georgia,serif;margin:22px 0 12px;background:linear-gradient(90deg,#ffc23c,#ff4d8d,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent;border-left:4px solid var(--accent);padding-left:10px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar select,.bar button{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:8px 14px;border-radius:18px;font:inherit;cursor:pointer}
.chip{background:none;border:0;color:var(--mute);padding:7px 14px;border-radius:20px;cursor:pointer;font:inherit;white-space:nowrap}
.chip.on{background:var(--accent);color:#1a1307;font-weight:700}
.hd{display:flex;justify-content:space-between;align-items:baseline}
.hd a{color:var(--accent);cursor:pointer;font-size:14px}
.more{display:block;margin:24px auto;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:10px 24px;border-radius:20px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);overflow:auto;z-index:9990!important;padding:20px;display:flex;align-items:center;justify-content:center}
.modal[hidden]{display:none!important;pointer-events:none!important;visibility:hidden!important;z-index:-99999!important;opacity:0!important}
.sheet{max-width:900px;width:100%;margin:auto;background:var(--panel);border-radius:16px;overflow:hidden;position:relative;border:1px solid var(--line)}
.top{display:flex;gap:18px;padding:20px;flex-wrap:wrap}
.top img{width:150px;border-radius:8px}
.x{position:absolute;top:10px;left:10px;z-index:3;background:#000b;border:0;color:var(--text);border-radius:50%;width:42px;height:42px;padding:0 0 4px;font-size:30px;line-height:42px;text-align:center;cursor:pointer}
.seasons{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px}
.seasons button{background:var(--bg);color:var(--mute);border:1px solid var(--line);padding:6px 14px;border-radius:16px;cursor:pointer}
.seasons button.on{background:var(--accent);color:#1a1307;border-color:var(--accent)}
.eps{padding:12px 20px 20px;display:grid;gap:10px}
.ep{display:flex;gap:12px;background:var(--bg);border-radius:8px;padding:10px;border:1px solid var(--line);transition:border-color .2s}
.ep:hover{border-color:var(--accent)}
.ep img{width:120px;height:68px;object-fit:cover;border-radius:6px;background:#2a2420;flex:none}
.ep b{display:block}.ep p{color:var(--mute);font-size:13px}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--pitch);border-radius:8px;padding:12px 16px;margin-bottom:10px}
.match .t{display:flex;align-items:center;gap:8px}.match .t:last-of-type{justify-content:flex-end}
.match img{width:26px;height:26px;object-fit:contain}
.score{font:800 20px Georgia,serif;text-align:center}
.score small{display:block;font:12px sans-serif;color:var(--mute)}
.live{color:#ff5a4d!important;font-weight:700}
.msg{color:var(--mute);padding:20px 0}
.watch{margin-left:8px;background:var(--pitch);color:#04170d;font-weight:700;padding:5px 14px;border-radius:16px;border:0;cursor:pointer}
@media(max-width:560px){.match{grid-template-columns:1fr}.match .t:last-of-type{justify-content:flex-start}}

.vip,.play{border:0;cursor:pointer;font:700 14px inherit;color:#2a1500;background:linear-gradient(135deg,#ffe27a,var(--gold),#ff9a3c);padding:9px 18px;border-radius:22px;box-shadow:0 4px 16px #ffc23c55}
.play{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 16px #ff4d8d66;padding:11px 24px;font-size:16px}
.hero{min-height:260px;border-radius:18px;background:#151530 center/cover;padding:36px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;margin-bottom:8px}
.hero h1{font:800 34px Georgia,serif;max-width:600px}.hero p{max-width:520px;color:#ddd}.hero .play{align-self:flex-start}

.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;padding:0 20px}
.plan{cursor:pointer;text-align:center;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:16px 8px;transition:.2s}
.plan b{display:block;font-size:22px;color:var(--gold)}.plan.on{border-color:var(--accent);background:#ff4d8d1f;transform:scale(1.04)}
.payrow{display:flex;gap:10px;padding:18px 20px 6px;flex-wrap:wrap}.payrow input{max-width:none}

/* FULLSCREEN DIRECT HTML5 VIDEO PLAYER */
#player{position:fixed;inset:0;background:#000;z-index:2147483647!important;display:flex;align-items:center;justify-content:center;overflow:hidden}
#player video,#player iframe{width:100%;height:100%;border:0;background:#000;object-fit:contain;z-index:5;transition:object-fit .2s;pointer-events:auto!important}
#player video.cover-fill,#player iframe.cover-fill{object-fit:fill!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important}
.pbar{position:absolute;top:0;left:0;right:0;z-index:20!important;display:flex;align-items:center;gap:12px;padding:max(14px,env(safe-area-inset-top)) 18px 24px;background:linear-gradient(180deg,rgba(0,0,0,0.95) 0%,rgba(0,0,0,0.6) 70%,transparent 100%);transition:opacity 0.4s ease;opacity:0;pointer-events:none!important}
.pbar.show{opacity:1!important}

.loader-ring{width:48px;height:48px;border:4px solid #00ff88;border-color:#00ff88 transparent transparent transparent;border-radius:50%;animation:l-spin 1.2s cubic-bezier(0.5,0,0.5,1) infinite;margin:0 auto}
@keyframes l-spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

/* DISMISSIBLE 10-MINUTE RECURRING VIP BANNER */
.vip-banner-reminder {
  position: fixed !important;
  bottom: 85px !important;
  top: auto !important;
  left: 50% !important;

}

.vip-banner-reminder.hidden, #vipBannerReminder.hidden {

/* COMMUNITY HUB & POLICIES STYLING */
.filmbox-ultimate-hub {
  max-width: 900px;

.badge-vip {

  padding: 4px 14px;

.card-item {

/* NEWS FEED STYLING */
.news-card {

/* FIXED BOTTOM VIEWPORT DOCK */
.floating-dock {
  position: fixed !important;
  bottom: 0 !important;
  left: 0 !important;
  right: 0 !important;
  width: 100vw !important;
  max-width: 100vw !important;
  z-index: 10000 !important;
  background: rgba(10, 10, 22, 0.98) !important;
  backdrop-filter: blur(25px) !important;
  -webkit-backdrop-filter: blur(25px) !important;
  border-top: 2px solid rgba(255, 255, 255, 0.15) !important;
  display: flex !important;
  flex-direction: row !important;
  justify-content: space-evenly !important;
  align-items: center !important;
  gap: 6px !important;
  padding: 10px 8px calc(10px + env(safe-area-inset-bottom)) 8px !important;
  box-sizing: border-box !important;
  box-shadow: 0 -10px 35px rgba(0, 0, 0, 0.95) !important;
  pointer-events: auto !important;
}

/* HIDE FLOATING DOCK WHEN PLAYER IS ACTIVE */
body.player-open .floating-dock {
  display: none !important;
  visibility: hidden !important;
  pointer-events: none !important;
  z-index: -99999 !important;
  opacity: 0 !important;
}

.dock-btn {
  display: flex !important;
  flex-direction: row !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 6px !important;
  cursor: pointer !important;
  flex: 1 !important;
  padding: 10px 6px !important;
  margin: 0 2px !important;
  border-radius: 14px !important;
  font-weight: 800 !important;
  font-size: 13px !important;
  box-sizing: border-box !important;
  transition: all 0.25s ease-in-out !important;
  white-space: nowrap !important;
  pointer-events: auto !important;
}

  background: linear-gradient(135deg, rgba(255, 77, 141, 0.25), rgba(217, 70, 239, 0.25)) !important;

}

/* Series Box - Emerald Green */

  color: #34d399 !important;
  border: 1.5px solid #34d399 !important;
}
.dock-btn[data-v="tv"].on {

/* Library Box - Amber Gold */

button,.chip,.card,.dock-btn,.vip,.play,nav button,a{touch-action:manipulation!important;-webkit-tap-highlight-color:transparent!important;pointer-events:auto!important;user-select:none!important;-webkit-user-select:none!important}
</style>

<script>
// Mock AndroidApp for browser testing
if (typeof window.AndroidApp === 'undefined') {
    window.AndroidApp = {
        downloadMoviePrivate: (url, id, title) => alert("Mock Download: " + title),
        downloadTorrentPrivate: (url, id, title) => alert("Mock P2P Download: " + title),
        isMovieDownloaded: (id) => false,
        getOfflineMoviePath: (id) => "",
        getTorrentProgress: (id) => JSON.stringify({ progress: 0, speedKb: 0, status: "NOT_FOUND" })
    };
}

function showPurpleToast(msg) {
  let toast = document.getElementById("purpleToast");
  if (!toast) {

function checkVipActive() {
  try {
    const exp = parseInt(localStorage.getItem("mb_vip_expiry") || "0", 10);
    if (exp > Date.now()) {
      const daysLeft = Math.ceil((exp - Date.now()) / 86400000);
      const hoursLeft = Math.ceil((exp - Date.now()) / 3600000);
      const btn = $("#vipbtn");
      if (btn) btn.textContent = daysLeft > 1 ? `★ VIP · ${daysLeft}d left` : `★ VIP · ${hoursLeft}h left`;
      return true;
    } else {
      localStorage.removeItem("mb_vip_expiry");
      const btn = $("#vipbtn");
      if (btn) btn.textContent = "★ Go VIP";
      return false;
    }
  } catch(e) { return false; }
}

function getFirstLaunchTime() {
  try {
    let launchTime = parseInt(localStorage.getItem("mb_first_launch_time") || "0", 10);
    if (!launchTime || isNaN(launchTime)) {
      launchTime = Date.now();
      localStorage.setItem("mb_first_launch_time", String(launchTime));
    }
    return launchTime;
  } catch(e) { return Date.now(); }
}

function checkFreeTrialExpired() {
  if (checkVipActive()) return false;
  const launchTime = getFirstLaunchTime();
  const elapsedSeconds = (Date.now() - launchTime) / 1000;
  return elapsedSeconds >= FREE_WATCH_LIMIT;
}

      const errDetail = res.errorMessage || res.ResponseDescription || res.error_message || JSON.stringify(res);
      renderMpesaFailure("Safaricom Daraja Error", errDetail);
    }
  } catch(e) {
    renderMpesaFailure("Parsing Error", String(e.message));
  }
};

function startMpesaPolling(checkoutRequestId) {
  stopMpesaPolling();
  let attempts = 0;
  const maxAttempts = 30;

  stkPollTimer = setInterval(() => {
    attempts++;
    const box = $("#stkStatusBox");
    if (box) box.textContent = `⏳ Verifying M-Pesa PIN with Safaricom (${attempts}/${maxAttempts})...`;

    window.onMpesaQueryResponse = function(queryResStr) {
      try {
        const qRes = typeof queryResStr === 'string' ? JSON.parse(queryResStr) : queryResStr;
        const resCode = String(qRes.ResultCode !== undefined ? qRes.ResultCode : (qRes.resultCode !== undefined ? qRes.resultCode : "1037"));

        if (resCode === "0") {
          stopMpesaPolling();
          const dur = PLAN_DURATIONS_MS[PLAN] || (7 * 24 * 3600 * 1000);
          localStorage.setItem("mb_vip_expiry", String(Date.now() + dur));
          checkVipActive();

          const md = $("#modal");
          if (md) {
            md.innerHTML = `<div class="sheet" style="padding:40px 20px;text-align:center;background:radial-gradient(circle at top,#042d17 0%,#0f172a 100%);border:2px solid #25D366;box-shadow:0 0 40px rgba(37,211,102,0.5);border-radius:24px">
              <div style="font-size:56px;margin-bottom:12px;animation:floatHero 2s infinite">🎉</div>
              <span style="display:inline-block;padding:4px 14px;background:rgba(37,211,102,0.25);border:1px solid #25D366;border-radius:20px;color:#25D366;font-size:11px;font-weight:900;letter-spacing:1px;margin-bottom:10px">REAL-TIME PAYMENT CONFIRMED</span>
              <h2 style="color:#00ff88;margin:0 0 10px;font-size:24px;font-weight:900">M-Pesa VIP Activated!</h2>
              <p style="color:#cbd5e1;font-size:15px;margin-bottom:24px;line-height:1.5">Your payment was verified in real-time by Safaricom. Enjoy ad-free 1080p HD cinema streaming!</p>
              <button class="play" onclick="closeM(); showPurpleToast('🥰 Thank you so much for supporting our company! VIP Access Unlocked! 🌟')" style="background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;font-weight:900;padding:12px 30px;box-shadow:0 6px 20px rgba(37,211,102,0.4)">Start Watching Now ▶</button>
            </div>`;
          }
        } else if (resCode === "1") {
          stopMpesaPolling();
          renderMpesaFailure("Insufficient M-Pesa Balance", "Your M-Pesa account balance was insufficient to complete this VIP pass transaction.");
        } else if (resCode === "1032") {
          stopMpesaPolling();
          renderMpesaFailure("Prompt Cancelled on Phone", "The M-Pesa PIN prompt was cancelled or timed out on your phone screen.");
        } else if (resCode === "1001" || resCode === "2001") {
          stopMpesaPolling();
          renderMpesaFailure("Incorrect M-Pesa PIN Entered", "The M-Pesa PIN entered was incorrect or rejected by Safaricom.");
        }
      } catch(e) {}
    };

    if (typeof AndroidKYC !== 'undefined' && AndroidKYC.queryMpesaSTKStatus) {
      AndroidKYC.queryMpesaSTKStatus(checkoutRequestId, "onMpesaQueryResponse");
    } else if (typeof AndroidMpesa !== 'undefined' && AndroidMpesa.queryMpesaSTKStatus) {
      AndroidMpesa.queryMpesaSTKStatus(checkoutRequestId, "onMpesaQueryResponse");
    }

    if (attempts >= maxAttempts) {
      stopMpesaPolling();
      renderMpesaFailure("Transaction Timeout", "Safaricom payment verification timed out. Please try again.");
    }
  }, 2500);
}

const SORTS = [["popularity.desc", "Most popular"], ["vote_average.desc", "Top rated"], ["primary_release_date.desc", "Newest"], ["revenue.desc", "Box office"]];
const genreCache = {};

async function browse() {
  try {
    const type = S.view, m = $("#main");
    if (!type || (type !== "movie" && type !== "tv")) return;

    const defaultGenres = [
      { id: 28, name: "Action" },
      { id: 35, name: "Comedy" },
      { id: 18, name: "Drama" },
      { id: 27, name: "Horror" },
      { id: 878, name: "Sci-Fi" },
      { id: 53, name: "Thriller" },
      { id: 16, name: "Animation" }
    ];
    const genresList = genreCache[type] || defaultGenres;
    const sorts = type === "tv" ? SORTS.slice(0, 3).map(s => s[0] === "primary_release_date.desc" ? ["first_air_date.desc", s[1]] : s) : SORTS;
    if (!sorts.some(s => s[0] === S.sort)) S.sort = "popularity.desc";

    m.innerHTML = `<h2>${S.query ? `Results for “${esc(S.query)}”` : type === "movie" ? "All Movies" : "All Series"}</h2>` +
      (S.query ? "" : `<div class="bar"><select id="sort" aria-label="Sort">${sorts.map(s => `<option value="${s[0]}" ${s[0] === S.sort ? "selected" : ""}>${s[1]}</option>`).join("")}</select></div>
      <div class="bar"><button class="chip ${S.genre ? "" : "on"}" onclick="setGenre('')">All genres</button>${genresList.map(g => `<button class="chip ${S.genre == g.id ? "on" : ""}" onclick="setGenre(${g.id})">${esc(g.name)}</button>`).join("")}</div>`) +
      `<div class="grid" id="grid"></div><p class="msg" id="info"></p><button class="more" id="more" hidden onclick="more()">Load more</button>`;
    if ($("#sort")) $("#sort").onchange = e => { S.sort = e.target.value; S.page = 1; browse() };

    fetchPage(false);

    if (!genreCache[type]) {
      tmdb(`/genre/${type}/list`).then(res => {
        if (res && res.genres) genreCache[type] = res.genres;
      }).catch(e => {});
    }
  } catch(e) {
    console.error("browse error:", e);
  }
}

function setGenre(g) { S.genre = g; S.page = 1; browse() }

async function fetchPage(append) {
  const type = S.view;
  const gridEl = $("#grid");
  const localList = (type === "tv" ? LOCAL_MASTER_SERIES : LOCAL_MASTER_MOVIES);

  if (!append && gridEl) {
    gridEl.innerHTML = localList.map(i => card(i, type)).join("");
  }

  try {
    let d;
    if (S.query) d = await tmdb("/search/" + type, { query: S.query, page: S.page });
    else {
      const p = { page: S.page, sort_by: S.sort, with_genres: S.genre };
      if (S.sort === "vote_average.desc") p["vote_count.gte"] = 300;
      if (type === "movie" && S.sort.startsWith("primary")) p["primary_release_date.lte"] = today();
      if (type === "tv" && S.sort.startsWith("first_air")) p["first_air_date.lte"] = today();
      d = await tmdb("/discover/" + type, p);
    }
    if (d && d.results && d.results.length > 0) {
      const validResults = d.results.filter(i => (!i.release_date || i.release_date <= today()) && (i.vote_count === undefined || i.vote_count > 5));
      const html = validResults.map(i => card(i, type)).join("");
      if (gridEl) {
        if (append) {
          gridEl.insertAdjacentHTML("beforeend", html);
        } else {
          gridEl.innerHTML = html;
        }
      }
      const pages = Math.min(d.total_pages, 500);
      const infoEl = $("#info");
      if (infoEl) infoEl.textContent = `${d.total_results.toLocaleString()} titles found · page ${S.page} of ${pages.toLocaleString()}`;
      const moreEl = $("#more");
      if (moreEl) moreEl.hidden = S.page >= pages;
    }
  } catch (e) {
    if ($("#info")) $("#info").textContent = `${localList.length} blockbuster titles loaded.`;
  }
}

function more() { S.page++; fetchPage(true) }

function updateDownloadDashboardProgress() {
  if (window.AndroidApp && typeof window.AndroidApp.getTorrentProgress === 'function') {
    document.querySelectorAll('.download-item').forEach(item => {
      let movieId = item.getAttribute('data-movie-id');
      try {
        let progressRaw = window.AndroidApp.getTorrentProgress(movieId);
        let statusEl = item.querySelector('.progress-text');
        let pctBadge = item.querySelector('.badge-pct');
        let mbBadge = item.querySelector('.badge-mb');
        let barFill = item.querySelector('.progress-bar-fill');
        if (progressRaw) {
          let progJson = JSON.parse(progressRaw);
          let pct = progJson.progress || 0;
          let speedKb = progJson.speedKb || 0;
          let totalMb = progJson.totalMb || 0;
          let downloadedMb = progJson.downloadedMb || 0;

          if (progJson.status === "DOWNLOADING") {
            if (statusEl) statusEl.innerText = speedKb > 0 ? `⚡ ${speedKb} KB/s · Backgrounding` : `📡 Downloading in background`;
          } else if (progJson.status === "FINISHED" || pct >= 100) {
            if (statusEl) statusEl.innerText = `✅ Private Storage · Ready`;
            pct = 100;
          } else if (progJson.status === "NOT_FOUND") {
            if (statusEl) statusEl.innerText = `📥 Ready to Download`;
          } else {
            if (statusEl) statusEl.innerText = `⚠️ ${progJson.status}`;
          }

          if (pctBadge) pctBadge.innerText = pct + "%";
          if (mbBadge) {
            mbBadge.innerText = totalMb > 0 ? `${downloadedMb} MB / ${totalMb} MB` : `📡 Connecting to Server...`;
          }
          if (barFill) barFill.style.width = pct + "%";
        }
      } catch(e) {}
    });
  }
}

const MASTER_STREAM_POOL = [
  "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
  "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4",
  "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4",
  "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
  "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"
];

function getMasterStreamUrl(movieId) {
  let hash = 0;
  for (let i = 0; i < movieId.length; i++) {
    hash = ((hash << 5) - hash) + movieId.charCodeAt(i);
    hash |= 0;
  }
  const index = Math.abs(hash) % MASTER_STREAM_POOL.length;
  return MASTER_STREAM_POOL[index];
}

function downloadEpisode(title, season, ep, estMB) {
  if (!checkVipActive()) {
    openVip("Offline downloading requires an active VIP pass. Unlock a plan to save unlimited movies!");
    return;
  }
  const credits = getDownloadCredits();
  if (credits <= 0) { openDownloadPassModal(); return; }
  try {
    let raw = localStorage.getItem("mb_offline_downloads") || "[]";
    let list = JSON.parse(raw);
    const epTitle = (CUR.type === "tv") ? `${title} - S${season}E${ep}` : title;
    const movieId = String(CUR.id);
    const videoUrl = getMasterStreamUrl(movieId);

    if (!list.some(x => x.title === epTitle)) {
      list.push({ id: movieId, type: CUR.type || "movie", title: epTitle, poster: poster(CUR.poster_path) });
      localStorage.setItem("mb_offline_downloads", JSON.stringify(list));
      const newCredits = credits - 1;
      localStorage.setItem("mb_download_credits", String(newCredits));

      if (typeof window.AndroidApp !== 'undefined' && window.AndroidApp.downloadMoviePrivate) {
        window.AndroidApp.downloadMoviePrivate(videoUrl, movieId, epTitle);
      } else {
        showPurpleToast(`📥 Background Download Started! "${epTitle}"`);
      }
    } else {
      showPurpleToast(`"${epTitle}" is already in your offline library!`);
    }
  } catch(e) {
    showPurpleToast("Download error: " + e.message);
  }
}

      <button onclick="event.stopPropagation();toggleVideoZoom()" aria-label="Screen Fill Zoom" style="background:rgba(15,23,42,0.85);color:#fff;border:2px solid #38bdf8;border-radius:50%;width:38px;height:38px;font-size:16px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(56,189,248,0.4);flex-shrink:0;pointer-events:auto">⛶</button>
    </div>` +
    `<iframe id="playerIframe" src="${url}" allow="autoplay; encrypted-media; fullscreen; picture-in-picture; web-share" allowfullscreen style="width:100%;height:100%;border:0;background:#000;z-index:5;pointer-events:auto"></iframe>`;

  document.body.appendChild(p);

  setTimeout(() => {
    const l = $("#playerLoader");
    if (l) l.style.display = "none";
  }, 400);

  resetPbarTimer(3500);
}

function switchServer(service) {
  const c = CUR;
  if (!c) return;
  c.season = c.season || 1;
  c.episode = c.episode || 1;
  let newUrl = "";
  if (service === 'vidlink') {
    newUrl = c.type === "tv" ? `https://vidlink.pro/tv/${c.id}/${c.season}/${c.episode}` : `https://vidlink.pro/movie/${c.id}`;
  } else if (service === 'vidsrc') {
    newUrl = c.type === "tv" ? `https://vidsrc.to/embed/tv/${c.id}/${c.season}/${c.episode}` : `https://vidsrc.to/embed/movie/${c.id}`;
  } else if (service === 'embedsu') {
    newUrl = c.type === "tv" ? `https://embed.su/embed/tv/${c.id}/${c.season}/${c.episode}` : `https://embed.su/embed/movie/${c.id}`;
  } else if (service === 'autoembed') {
    newUrl = c.type === "tv" ? `https://player.autoembed.cc/embed/tv/${c.id}/${c.season}/${c.episode}` : `https://player.autoembed.cc/embed/movie/${c.id}`;
  } else if (service === '2embed') {
    newUrl = c.type === "tv" ? `https://www.2embed.cc/embedtv/${c.id}&s=${c.season}&e=${c.episode}` : `https://www.2embed.cc/embed/${c.id}`;
  } else if (service === 'smashystream') {
    newUrl = c.type === "tv" ? `https://player.smashystream.xyz/tv/${c.id}?s=${c.season}&e=${c.episode}` : `https://player.smashystream.xyz/movie/${c.id}`;
  } else if (service === 'vidsrcme') {
    newUrl = c.type === "tv" ? `https://vidsrc.me/embed/tv?tmdb=${c.id}&season=${c.season}&episode=${c.episode}` : `https://vidsrc.me/embed/movie?tmdb=${c.id}`;
  } else if (service === 'multiembed') {
    newUrl = c.type === "tv" ? `https://multiembed.mov/?video_id=${c.id}&tmdb=1&s=${c.season}&e=${c.episode}` : `https://multiembed.mov/?video_id=${c.id}&tmdb=1`;
  }
  const iframe = $("#playerIframe");
  if (iframe) iframe.src = newUrl;
  showPurpleToast(`🔄 Switched to Server: ${service.toUpperCase()}`);
}

function closePlayer() {
  stopWatchTimer();
  document.body.classList.remove("player-open");
  if (typeof AndroidKYC !== 'undefined' && AndroidKYC.setFullscreenMode) AndroidKYC.setFullscreenMode(false);
  const p = $("#player"); if (p) p.remove();
}

function checkOnlineStatus() {
  return true;
}

/* ---------- INITIALIZE ON LOAD ---------- */
async function verifyActiveInternetAccess() {
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 4000);
    const r = await fetch("https://api.themoviedb.org/3/configuration?api_key=ea220cf0b8ca48bb8aa393a5228b688b", { signal: controller.signal });
    clearTimeout(timeoutId);
    return r.ok;
  } catch(e) {
    return false;
  }
}

let appInitialized = false;
function checkOnlineStatus() {
  if (typeof navigator.onLine !== 'undefined' && !navigator.onLine) {
    showOfflineScreen();
    return false;
  }
  return true;
}

function showOfflineScreen() {
  const m = $("#main");
  if (m) {
    m.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:75vh;padding:30px;text-align:center;background:#0b0b1a;color:#fff">
      <div style="font-size:64px;margin-bottom:16px">📡</div>
      <h2 style="color:#f43f5e;font-size:24px;font-weight:900;margin-bottom:10px">No Internet Connection</h2>
      <p style="color:#cbd5e1;font-size:14px;line-height:1.6;max-width:400px;margin-bottom:24px">Film Box requires an active internet connection to stream movies, live sports, and verify VIP passes. Please check your network connection and try again.</p>
      <button class="vip" onclick="window.location.reload()" style="background:linear-gradient(135deg,#a855f7,#38bdf8);color:#fff;font-weight:900;padding:12px 30px;border-radius:20px;border:none;cursor:pointer">Retry Connection</button>
    </div>`;
  }
}

window.addEventListener('offline', showOfflineScreen);
window.addEventListener('online', () => window.location.reload());

function initApp() {
  const m = $("#main");
  if (!m) {
    setTimeout(initApp, 30);
    return;
  }
  if (appInitialized) return;
  try {
    checkVipActive();
    render();
    appInitialized = true;
    start10MinVipBannerTimer();
    if (typeof navigator.onLine !== 'undefined' && !navigator.onLine) {
      showPurpleToast("📡 Offline mode active. Connect to internet for live updates.");
    }
  } catch(e) {
    if (m) m.innerHTML = `<div style="padding:30px;text-align:center"><h3 style="color:#ff4d4d">Error Loading App</h3><p>${esc(e.message)}</p></div>`;
  }
}

if (document.readyState === "complete" || document.readyState === "interactive") {
  initApp();
} else {
  window.addEventListener("DOMContentLoaded", initApp);
  window.addEventListener("load", initApp);
  setTimeout(initApp, 100);
}

window.addEventListener("scroll", () => {
  if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
    if (S.view === "home" && typeof loadMoreHomeMovies === "function") {
      loadMoreHomeMovies();
    } else if ((S.view === "movie" || S.view === "tv") && typeof more === "function") {
      more();
    }
  }
});
</script>
