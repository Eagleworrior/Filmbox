<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Box</title>
<style>
:root{--bg:#14110f;--panel:#201b18;--line:#352e29;--text:#f3ece4;--mute:#a79c91;--accent:#f2b134;--pitch:#2fa36b}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Trebuchet MS",Verdana,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 20px}
.logo{font:800 22px Georgia,serif;color:var(--accent);margin-right:8px;cursor:pointer}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button,.chip{background:none;border:0;color:var(--mute);padding:7px 14px;border-radius:20px;cursor:pointer;font:inherit;white-space:nowrap}
nav button.on,.chip.on{background:var(--accent);color:#1a1307;font-weight:700}
input,select{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:20px;font:inherit}
input{flex:1;min-width:140px;max-width:320px}
main{padding:20px;max-width:1200px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.row{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px}
.row .card{flex:0 0 150px}
.card{cursor:pointer;background:var(--panel);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.card:focus-visible,button:focus-visible{outline:2px solid var(--accent)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#2a2420}
.card div{padding:8px 10px;font-size:13px}
.card small{color:var(--mute)}
h2{font:700 20px Georgia,serif;margin:22px 0 12px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.hd{display:flex;justify-content:space-between;align-items:baseline}
.hd a{color:var(--accent);cursor:pointer;font-size:14px}
.more{display:block;margin:24px auto;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:10px 24px;border-radius:20px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);overflow:auto;z-index:10;padding:20px}
.sheet{max-width:900px;margin:auto;background:var(--panel);border-radius:12px;overflow:hidden}
.top{display:flex;gap:18px;padding:20px;flex-wrap:wrap}
.top img{width:150px;border-radius:8px}
.x{float:right;background:none;border:0;color:var(--text);font-size:28px;cursor:pointer;padding:4px 14px}
.frame{aspect-ratio:16/9;width:100%;border:0;background:#000}
.seasons{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px}
.seasons button{background:var(--bg);color:var(--mute);border:1px solid var(--line);padding:6px 14px;border-radius:16px;cursor:pointer}
.seasons button.on{background:var(--accent);color:#1a1307;border-color:var(--accent)}
.eps{padding:12px 20px 20px;display:grid;gap:10px}
.ep{display:flex;gap:12px;background:var(--bg);border-radius:8px;padding:10px;border:1px solid var(--line)}
.ep img{width:120px;height:68px;object-fit:cover;border-radius:6px;background:#2a2420;flex:none}
.ep b{display:block}.ep p{color:var(--mute);font-size:13px}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--pitch);border-radius:8px;padding:12px 16px;margin-bottom:10px}
.match .t{display:flex;align-items:center;gap:8px}.match .t:last-of-type{justify-content:flex-end}
.match img{width:26px;height:26px;object-fit:contain}
.score{font:800 20px Georgia,serif;text-align:center}
.score small{display:block;font:12px sans-serif;color:var(--mute)}
.live{color:#ff5a4d!important;font-weight:700}
.msg{color:var(--mute);padding:20px 0}
.watch{margin-left:8px;background:var(--pitch);color:#04170d;font-weight:700;padding:5px 14px;border-radius:16px;border:0;cursor:pointer}
@media(max-width:560px){.match{grid-template-columns:1fr}.match .t:last-of-type{justify-content:flex-start}}

:root{--bg:#0b0b1a;--panel:#151530;--line:#2a2a55;--text:#f5f3ff;--mute:#a09dcc;--accent:#ff4d8d;--accent2:#7c5cff;--gold:#ffc23c;--pitch:#19d3a2}
body{background:radial-gradient(1100px 600px at 8% -10%,#4a22a055,transparent),radial-gradient(900px 500px at 100% 0,#ff4d8d33,transparent),var(--bg);background-attachment:fixed}
header{background:#0b0b1acc;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{background:linear-gradient(90deg,var(--gold),var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:26px}
nav button.on,.chip.on,.seasons button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 4px 14px #7c5cff55}
.chip,nav button{background:#ffffff0d}
.card{transition:.2s;border-color:#ffffff14}.card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 12px 30px #7c5cff55}
h2{border-left:4px solid var(--accent);padding-left:10px}
.vip,.play{border:0;cursor:pointer;font:700 14px inherit;color:#2a1500;background:linear-gradient(135deg,#ffe27a,var(--gold),#ff9a3c);padding:9px 18px;border-radius:22px;box-shadow:0 4px 16px #ffc23c55}
.play{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 16px #ff4d8d66;padding:11px 24px;font-size:16px;position:relative;z-index:5;cursor:pointer;pointer-events:auto}
.vip{position:relative;z-index:5;cursor:pointer;pointer-events:auto}
.hero{min-height:260px;border-radius:18px;background:#151530 center/cover;padding:36px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;margin-bottom:8px}
.hero h1{font:800 34px Georgia,serif;max-width:600px}.hero p{max-width:520px;color:#ddd}.hero .play{align-self:flex-start}
.sheet{position:relative;border:1px solid var(--line)}
.x{position:absolute;top:10px;left:10px;z-index:3;float:none;background:#000b;border-radius:50%;width:42px;height:42px;padding:0 0 4px;font-size:30px;line-height:42px;text-align:center}
.watchrow{display:flex;gap:12px;align-items:center;padding:14px 20px;flex-wrap:wrap}.tag{color:var(--mute);font-size:13px}
.ep:hover{border-color:var(--accent)}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;padding:0 20px}
.plan{cursor:pointer;text-align:center;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:16px 8px;transition:.2s}
.plan b{display:block;font-size:22px;color:var(--gold)}.plan.on{border-color:var(--accent);background:#ff4d8d1f;transform:scale(1.04)}
.payrow{display:flex;gap:10px;padding:18px 20px 6px;flex-wrap:wrap}.payrow input{max-width:none}

/* FULLSCREEN VIDEO PLAYER & TRANSPARENT AD SHIELD */
#player{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;overflow:hidden}
#playerShield{position:absolute;inset:0;z-index:10;background:transparent;cursor:pointer}
#player video,#player iframe{width:100%;height:100%;border:0;background:#000;object-fit:contain}
.pbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 28px;background:linear-gradient(#000d,transparent);transition:opacity .3s;opacity:0;pointer-events:none}
.pbar.show{opacity:1;pointer-events:auto}
.pbar button{background:#ffffff22;color:#fff;border:0;border-radius:50%;width:42px;height:42px;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pbar button.next-icon{background:var(--accent);color:#000;font-weight:900;font-size:22px}

.loader-ring{width:48px;height:48px;border:4px solid #00ff88;border-color:#00ff88 transparent transparent transparent;border-radius:50%;animation:l-spin 1.2s cubic-bezier(0.5,0,0.5,1) infinite;margin:0 auto}
@keyframes l-spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
</head>
<body>
<header>
  <span class="logo" onclick="go('home')">Movie Box</span>
  <nav id="nav">
    <button data-v="home" class="on">Home</button>
    <button data-v="movie">Movies</button>
    <button data-v="tv">Series</button>
    <button data-v="football">Football</button>
    <button data-v="download">💾 Downloads</button>
  </nav>
  <input id="q" type="search" placeholder="Search any movie or series" aria-label="Search">
  <button class="vip" id="vipbtn" onclick="openVip()">★ Go VIP</button>
</header>
<main id="main"></main>
<div id="modal" class="modal" hidden></div>

<script>
const TMDB_KEY = "4e44d9029b1270a757cddc766a1bcb63";
const FOOTBALL_DATA_TOKEN = "deefb3193ba84b1ebdffad3f9e3df2d6";
const SPORTSRC_KEY = "2ccca35a74930eb00a71a67597928545";

const IMG = "https://image.tmdb.org/t/p/";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const poster = (p, w = "w342") => p ? IMG + w + p : "https://via.placeholder.com/500x750?text=Movie+Box";
const today = () => new Date().toISOString().slice(0, 10);
const S = { view: "home", page: 1, genre: "", sort: "popularity.desc", query: "", comp: "", range: "today" };
let timer;
let FREE_WATCH_LIMIT = 1800; // 30 minutes in seconds
let freeWatchTimer = null;
let pbarTimer = null;

const tmdb = (path, p = {}, retry = 0) => {
  const u = new URL("https://api.themoviedb.org/3" + path);
  u.searchParams.set("api_key", TMDB_KEY);
  Object.entries(p).forEach(([k, v]) => v !== "" && u.searchParams.set(k, v));
  return fetch(u.toString()).then(r => {
    if (!r.ok) throw new Error("TMDb " + r.status);
    return r.json();
  }).catch(err => {
    if (retry < 2) {
      return new Promise(res => setTimeout(res, 1200)).then(() => tmdb(path, p, retry + 1));
    }
    throw err;
  });
};

function go(v) {
  S.view = v; S.page = 1; S.genre = ""; S.sort = "popularity.desc"; S.query = ""; $("#q").value = "";
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  render();
}
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => go(b.dataset.v));

let t; $("#q").oninput = e => {
  clearTimeout(t); t = setTimeout(() => {
    S.query = e.target.value.trim(); S.page = 1;
    if (S.query) {
      searchMulti(S.query);
    } else {
      render();
    }
  }, 300);
};

async function searchMulti(query) {
  const m = $("#main");
  m.innerHTML = `<h2>Search results for “${esc(query)}”</h2><div class="grid" id="grid"></div><p class="msg" id="info">Searching…</p>`;
  try {
    const d = await tmdb("/search/multi", { query: query, page: S.page });
    const results = (d.results || []).filter(i => i.media_type === "movie" || i.media_type === "tv" || i.poster_path);
    const html = results.map(i => card(i, i.media_type || "movie")).join("");
    $("#grid").innerHTML = html || `<p class="msg" style="grid-column:1/-1">No titles found for "${esc(query)}". Try another keyword.</p>`;
    $("#info").textContent = `${results.length} titles found for "${esc(query)}"`;
  } catch(e) {
    $("#info").textContent = "Could not load search results (" + e.message + ").";
  }
}

function render() {
  clearInterval(timer);
  ({ home, movie: browse, tv: browse, football, download: downloadView })[S.view]();
}

/* ---------- cards ---------- */
function card(i, type) {
  const ty = i.media_type || type, title = i.title || i.name, date = (i.release_date || i.first_air_date || "").slice(0, 4);
  return `<div class="card" tabindex="0" onclick="quickPlay(${i.id},'${ty}','${esc(title)}')" onkeydown="if(event.key==='Enter')this.click()">
    <img loading="lazy" src="${poster(i.poster_path)}" alt="${esc(title)}"><div>${esc(title)}<br><small>${date} · ★ ${(i.vote_average || 0).toFixed(1)}</small></div></div>`;
}

function quickPlay(id, type, title) {
  CUR = { id, type, title, season: 1, episode: 1 };
  if (type === "tv") {
    openTitle(id, type);
  } else {
    play(1, 1);
  }
}

/* ---------- home ---------- */
async function home() {
  const m = $("#main");
  m.innerHTML = `<div class="hero" id="hero"></div><h2>Trending movies</h2><div class="row" id="h1"></div>
    <h2>Trending series</h2><div class="row" id="h2"></div>
    <div class="hd"><h2>Football today</h2><a onclick="go('football')">All matches</a></div><div id="h3"><p class="msg">Loading…</p></div>
    <div class="hd"><h2>Top rated movies</h2><a onclick="go('movie')">Browse all movies</a></div><div class="row" id="h4"></div>
    <div class="hd"><h2>Top rated series</h2><a onclick="go('tv')">Browse all series</a></div><div class="row" id="h5"></div>`;
  const fill = (id, p, type) => p.then(d => $(id).innerHTML = d.results.map(i => card(i, type)).join("")).catch(e => $(id).innerHTML = `<p class="msg">${esc(e.message)}</p>`);
  tmdb("/trending/movie/week").then(d => {
    $("#h1").innerHTML = d.results.map(i => card(i, "movie")).join("");
    const t = d.results[0];
    if (t.backdrop_path) $("#hero").style.backgroundImage = `linear-gradient(90deg,#0b0b1af0 25%,transparent),url(${IMG}w780${t.backdrop_path})`;
    $("#hero").innerHTML = `<h1>${esc(t.title)}</h1><p>${esc((t.overview || "").slice(0, 170))}…</p><button class="play" onclick="quickPlay(${t.id},'movie','${esc(t.title)}')">▶ Watch now</button>`;
  }).catch(e => $("#h1").innerHTML = `<p class="msg">${esc(e.message)}</p>`);
  fill("#h2", tmdb("/trending/tv/week"), "tv");
  fill("#h4", tmdb("/movie/top_rated"), "movie");
  fill("#h5", tmdb("/tv/top_rated"), "tv");
  loadMatches("#h3", { comp: "", range: "today" }, 6);
}

/* ---------- movies / series: full catalogue ---------- */
const SORTS = [["popularity.desc", "Most popular"], ["vote_average.desc", "Top rated"], ["primary_release_date.desc", "Newest"], ["revenue.desc", "Box office"]];
const genreCache = {};
async function browse() {
  const type = S.view, m = $("#main");
  if (!genreCache[type]) { try { genreCache[type] = (await tmdb(`/genre/${type}/list`)).genres } catch (e) { genreCache[type] = [] } }
  const sorts = type === "tv" ? SORTS.slice(0, 3).map(s => s[0] === "primary_release_date.desc" ? ["first_air_date.desc", s[1]] : s) : SORTS;
  if (!sorts.some(s => s[0] === S.sort)) S.sort = "popularity.desc";
  m.innerHTML = `<h2>${S.query ? `Results for “${esc(S.query)}”` : type === "movie" ? "All movies" : "All series"}</h2>` +
    (S.query ? "" : `<div class="bar"><select id="sort" aria-label="Sort">${sorts.map(s => `<option value="${s[0]}" ${s[0] === S.sort ? "selected" : ""}>${s[1]}</option>`).join("")}</select></div>
    <div class="bar"><button class="chip ${S.genre ? "" : "on"}" onclick="setGenre('')">All genres</button>${genreCache[type].map(g => `<button class="chip ${S.genre == g.id ? "on" : ""}" onclick="setGenre(${g.id})">${esc(g.name)}</button>`).join("")}</div>`) +
    `<div class="grid" id="grid"></div><p class="msg" id="info"></p><button class="more" id="more" hidden onclick="more()">Load more</button>`;
  if ($("#sort")) $("#sort").onchange = e => { S.sort = e.target.value; S.page = 1; browse() };
  fetchPage(false);
}
function setGenre(g) { S.genre = g; S.page = 1; browse() }
async function fetchPage(append) {
  const type = S.view;
  try {
    let d;
    if (S.query) d = await tmdb("/search/" + type, { query: S.query, page: S.page });
    else {
      const p = { page: S.page, sort_by: S.sort, with_genres: S.genre };
      if (S.sort === "vote_average.desc") p["vote_count.gte"] = 300;
      if (type === "movie" && S.sort.startsWith("primary")) p["primary_release_date.lte"] = today();
      if (type === "tv" && S.sort.startsWith("first_air")) p["first_air_date.lte"] = today();
      d = await tmdb("/discover/" + type, p);
    }
    const html = d.results.map(i => card(i, type)).join("");
    $("#grid").insertAdjacentHTML(append ? "beforeend" : "afterbegin", html);
    const pages = Math.min(d.total_pages, 500);
    $("#info").textContent = `${d.total_results.toLocaleString()} titles found · page ${S.page} of ${pages.toLocaleString()}`;
    $("#more").hidden = S.page >= pages;
  } catch (e) { $("#info").textContent = "Could not load titles (" + e.message + "). Check internet connection." }
}
function more() { S.page++; fetchPage(true) }

/* ---------- details, seasons, episodes ---------- */
let CUR = {};
async function openTitle(id, type) {
  const md = $("#modal"); md.hidden = false; md.innerHTML = `<div class="sheet"><p class="msg" style="padding:20px">Loading…</p></div>`;
  try {
    const d = await tmdb(`/${type}/${id}`, { append_to_response: "videos" });
    const title = d.title || d.name;
    CUR = { type, id, title, poster_path: d.poster_path, season: 1, episode: 1 };
    const backdrop = d.backdrop_path ? IMG + "w780" + d.backdrop_path : poster(d.poster_path, "w780");
    md.innerHTML = `<div class="sheet"><button class="x" onclick="closeM()" aria-label="Back">‹</button>
      <div class="hero" style="background-image:linear-gradient(180deg,transparent,#151530),url('${backdrop}');min-height:220px;border-radius:12px 12px 0 0;margin:0">
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="play" onclick="play(CUR.season,CUR.episode)">▶ Watch in HD</button>
        </div>
      </div>
      <div class="top"><img src="${poster(d.poster_path)}" alt="">
      <div style="flex:1;min-width:220px"><h2 style="margin-top:0">${esc(title)}</h2>
      <small style="color:var(--mute)">${(d.release_date || d.first_air_date || "").slice(0, 4)} · ${(d.genres || []).map(g => esc(g.name)).join(", ")} · ${d.runtime ? d.runtime + " min" : (d.number_of_seasons || 0) + " seasons · " + (d.number_of_episodes || 0) + " episodes"} · ★ ${(d.vote_average || 0).toFixed(1)}</small>
      <p style="margin-top:10px">${esc(d.overview)}</p></div></div>
      ${type === "tv" ? `<h2 style="padding:0 20px;margin-top:0">Seasons & Episodes</h2><div class="seasons" id="ss"></div><div class="eps" id="eps"></div>` : ""}</div>`;
    if (type === "tv") {
      const seasons = (d.seasons || []).filter(s => s.season_number > 0 || d.seasons.length === 1);
      $("#ss").innerHTML = seasons.map(s => `<button data-n="${s.season_number}">${esc(s.name)}</button>`).join("");
      $("#ss").onclick = e => { if (e.target.dataset.n !== undefined) loadSeason(id, e.target.dataset.n) };
      if (seasons[0]) loadSeason(id, seasons[0].season_number);
    }
  } catch (e) { md.innerHTML = `<div class="sheet"><button class="x" onclick="closeM()" aria-label="Back">‹</button><p class="msg" style="padding:20px">Could not load details (${esc(e.message)}).</p></div>` }
}

async function loadSeason(id, n) {
  CUR.season = parseInt(n, 10);
  document.querySelectorAll("#ss button").forEach(b => b.classList.toggle("on", b.dataset.n == n));
  $("#eps").innerHTML = `<p class="msg">Loading episodes…</p>`;
  try {
    const s = await tmdb(`/tv/${id}/season/${n}`);
    $("#eps").innerHTML = (s.episodes || []).map(e => `<div class="ep" onclick="CUR.episode=${e.episode_number};play(${n},${e.episode_number})" style="cursor:pointer"><img loading="lazy" src="${poster(e.still_path, "w300")}" alt="">
      <div><b>${e.episode_number}. ${esc(e.name)}</b><small style="color:var(--mute)">${e.air_date || ""}${e.runtime ? " · " + e.runtime + " min" : ""}</small><p>${esc((e.overview || "").slice(0, 180))}</p></div></div>`).join("") || `<p class="msg">No episodes listed yet.</p>`;
  } catch (e) { $("#eps").innerHTML = `<p class="msg">Could not load episodes.</p>` }
}

function closeM() { $("#modal").hidden = true; $("#modal").innerHTML = "" }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeM() });

/* ---------- football ---------- */
const COMPS = [["", "All leagues"], ["PL", "Premier League"], ["PD", "La Liga"], ["SA", "Serie A"], ["BL1", "Bundesliga"], ["FL1", "Ligue 1"], ["CL", "Champions League"], ["ELC", "Championship"], ["PPL", "Primeira Liga"], ["DED", "Eredivisie"]];
const RANGES = [["live", "Live now"], ["today", "Today"], ["week", "Next 7 days"], ["results", "Last 3 days"]];
function football() {
  const m = $("#main");
  m.innerHTML = `<h2>Football</h2>
    <div class="bar">${RANGES.map(r => `<button class="chip ${S.range === r[0] ? "on" : ""}" onclick="S.range='${r[0]}';football()">${r[1]}</button>`).join("")}</div>
    <div class="bar">${COMPS.map(c => `<button class="chip ${S.comp === c[0] ? "on" : ""}" onclick="S.comp='${c[0]}';football()">${c[1]}</button>`).join("")}</div>
    <div id="fb"></div><div id="sr"></div>`;
  loadMatches("#fb", S); loadSrc();
  timer = setInterval(() => loadMatches("#fb", S, 0, true), 60000);
}

async function loadMatches(sel, o, limit = 0, quiet, retry = 0) {
  const el = $(sel); if (!el) return;
  const day = n => new Date(Date.now() + n * 864e5).toISOString().slice(0, 10);
  let [a, b] = o.range === "week" ? [day(0), day(7)] : o.range === "results" ? [day(-3), day(0)] : [day(0), day(1)];
  if (!quiet) el.innerHTML = `<p class="msg">Loading matches…</p>`;
  try {
    const u = new URL("https://api.football-data.org/v4/matches");
    u.searchParams.set("dateFrom", a); u.searchParams.set("dateTo", b);
    if (o.comp) u.searchParams.set("competitions", o.comp);
    const r = await fetch(u.toString(), {
      headers: { "X-Auth-Token": FOOTBALL_DATA_TOKEN }
    });
    if (!r.ok) throw new Error(r.status === 429 ? "Rate limit reached, wait a minute" : "football-data " + r.status);
    let ms = (await r.json()).matches || [];
    if (o.range === "live") ms = ms.filter(x => ["IN_PLAY", "PAUSED", "LIVE"].includes(x.status));
    if (o.range === "today") ms = ms.filter(x => x.utcDate.slice(0, 10) === day(0) || ["IN_PLAY", "PAUSED"].includes(x.status));
    if (o.range === "results") ms = ms.filter(x => x.status === "FINISHED").reverse();
    if (limit) ms = ms.slice(0, limit);
    el.innerHTML = ms.length ? ms.map(match).join("") : `<p class="msg">No matches for this filter. Try another league or time range.</p>`;
  } catch (e) {
    if (retry < 2) {
      setTimeout(() => loadMatches(sel, o, limit, quiet, retry + 1), 1500);
      return;
    }
    el.innerHTML = `<p class="msg">Matches will refresh automatically when live.</p>`;
  }
}

function match(x) {
  const live = ["IN_PLAY", "PAUSED"].includes(x.status), done = x.status === "FINISHED", ft = x.score?.fullTime || {};
  const d = new Date(x.utcDate);
  const mid = (live || done) ? `${ft.home ?? 0} - ${ft.away ?? 0}<small class="${live ? "live" : ""}">${live ? "LIVE" : "Full time"}</small>`
    : `${d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}<small>${d.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" })}</small>`;
  return `<div class="match"><div class="t"><img src="${x.homeTeam.crest || ""}" alt=""><b>${esc(x.homeTeam.shortName || x.homeTeam.name)}</b></div>
   <div class="score">${mid}</div><div class="t"><b>${esc(x.awayTeam.shortName || x.awayTeam.name)}</b><img src="${x.awayTeam.crest || ""}" alt=""></div>
   <div style="grid-column:1/-1"><small style="color:var(--mute)">${esc(x.competition.name)}</small>${live ? `<button class="watch" onclick="watchLive('${esc(x.homeTeam.name)}','${esc(x.awayTeam.name)}')">Watch live</button>` : ""}</div></div>`;
}

function watchLive(h, a) {
  const cleanHome = String(h).toLowerCase().replace(/[^a-z0-9]/g, '-');
  const cleanAway = String(a).toLowerCase().replace(/[^a-z0-9]/g, '-');
  const url = `https://v2.sportsrc.com/embed/football/${cleanHome}-vs-${cleanAway}?api=${SPORTSRC_KEY}`;
  showPlayer(`${h} vs ${a}`, url, null);
}

const findArr = o => Array.isArray(o) ? o : o && typeof o === "object" ? (Object.values(o).map(findArr).find(a => a.length) || []) : [];
async function loadSrc() {
  const el = $("#sr"); if (!el) return;
  el.innerHTML = `<h2>More from SportSRC</h2><p class="msg">Loading…</p>`;
  try {
    const r = await fetch(`https://api.sportsrc.org/v2/?data=matches&category=football&api=${SPORTSRC_KEY}`),
      d = await r.json(),
      a = findArr(d);
    el.innerHTML = `<h2>More from SportSRC</h2>` + (a.length ? a.slice(0, 40).map(i => {
      const n = x => x && typeof x === "object" ? x.name || x.title : x;
      const t = i.title || i.name || ((n(i.home) || n(i.home_team) || n(i.team1) || "") + " vs " + (n(i.away) || n(i.away_team) || n(i.team2) || ""));
      return `<div class="match" style="grid-template-columns:1fr;cursor:pointer" onclick="watchLive('${esc(n(i.home)||"")}','${esc(n(i.away)||"")}')"><b>${esc(t)}</b><small style="color:var(--mute)">${esc([n(i.league), n(i.competition), i.status, i.time || i.date].filter(Boolean).join(" · "))}</small></div>`
    }).join("") : `<p class="msg">SportSRC live matches connected.</p>`);
  } catch (e) { el.innerHTML = `<h2>More from SportSRC</h2><p class="msg">SportSRC live fixtures connected.</p>` }
}

function togglePlayerControls() {
  const pbar = $("#pbar");
  if (!pbar) return;
  if (!pbar.classList.contains("show")) {
    pbar.classList.add("show");
    resetPbarTimer();
  } else {
    pbar.classList.remove("show");
  }
}

function resetPbarTimer() {
  clearTimeout(pbarTimer);
  pbarTimer = setTimeout(() => {
    const pbar = $("#pbar");
    if (pbar) pbar.classList.remove("show");
  }, 3000);
}

function handleIframeError() {
  const c = CUR;
  if (!c || !c.id) return;
  const isTv = c.type === "tv";
  const s = c.season || 1, e = c.episode || 1;
  const backupUrl = isTv ? `https://vidlink.pro/tv/${c.id}/${s}/${e}` : `https://vidlink.pro/movie/${c.id}`;
  const iframe = $("#playerIframe");
  if (iframe && iframe.src !== backupUrl) {
    iframe.src = backupUrl;
  }
}

async function play(s, e) {
  const c = CUR;
  if (!c) return;
  c.season = s || 1;
  c.episode = e || 1;
  let url = c.type === "tv" ? `https://vidsrc.to/embed/tv/${c.id}/${c.season}/${c.episode}` : `https://vidsrc.to/embed/movie/${c.id}`;
  showPlayer(c.title + (c.type === "tv" ? " · S" + c.season + "E" + c.episode : ""), url, c.key);
  startWatchTimer();
}

function playNextEpisode() {
  if (!CUR || CUR.type !== "tv") return;
  CUR.episode = (CUR.episode || 1) + 1;
  play(CUR.season, CUR.episode);
}

function showPlayer(title, url, key) {
  closePlayer();
  if (typeof AndroidKYC !== 'undefined' && AndroidKYC.setFullscreenMode) {
    AndroidKYC.setFullscreenMode(true);
  } else if (typeof AndroidMpesa !== 'undefined' && AndroidMpesa.setFullscreenMode) {
    AndroidMpesa.setFullscreenMode(true);
  }

  const p = document.createElement("div"); p.id = "player";
  const nextBtnHtml = (CUR && CUR.type === "tv") ? `<button class="next-icon" onclick="event.stopPropagation();playNextEpisode()" aria-label="Next Episode">›</button>` : ``;

  p.innerHTML = `<div class="pbar" id="pbar"><button onclick="event.stopPropagation();closePlayer()" aria-label="Back">‹</button><span>${esc(title)}</span>${nextBtnHtml}<button onclick="event.stopPropagation();rotate()" aria-label="Fullscreen">⛶</button></div>` +
    `<div id="playerShield" onclick="togglePlayerControls()"></div>` +
    (url ? `<iframe id="playerIframe" src="${url}" allow="autoplay; encrypted-media; fullscreen; picture-in-picture; web-share" allowfullscreen loading="eager" onerror="handleIframeError()"></iframe>`
      : key ? `<iframe id="playerIframe" src="https://www.youtube-nocookie.com/embed/${key}?autoplay=1&rel=0&playsinline=1" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>`
        : `<p class="msg" style="padding:80px 20px">No video available for this title yet.</p>`);
  document.body.appendChild(p);
  resetPbarTimer();
}

async function rotate() {
  const p = $("#player");
  try {
    if (!document.fullscreenElement) await p.requestFullscreen();
    const o = screen.orientation; if (o && o.lock) await o.lock(o.type.startsWith("landscape") ? "portrait" : "landscape");
  } catch { }
}

function closePlayer() {
  stopWatchTimer();
  if (typeof AndroidKYC !== 'undefined' && AndroidKYC.setFullscreenMode) {
    AndroidKYC.setFullscreenMode(false);
  } else if (typeof AndroidMpesa !== 'undefined' && AndroidMpesa.setFullscreenMode) {
    AndroidMpesa.setFullscreenMode(false);
  }
  try { screen.orientation && screen.orientation.unlock && screen.orientation.unlock(); if (document.fullscreenElement) document.exitFullscreen() } catch { }
  const p = $("#player"); if (p) p.remove();
}

/* ---------- 30-Min Free Trial & VIP Memory Engine ---------- */
function checkVipActive() {
  try {
    const exp = parseInt(localStorage.getItem("mb_vip_expiry") || "0", 10);
    if (exp > Date.now()) {
      const daysLeft = Math.ceil((exp - Date.now()) / 86400000);
      const hoursLeft = Math.ceil((exp - Date.now()) / 3600000);
      $("#vipbtn").textContent = daysLeft > 1 ? `★ VIP · ${daysLeft}d left` : `★ VIP · ${hoursLeft}h left`;
      return true;
    } else {
      localStorage.removeItem("mb_vip_expiry");
      $("#vipbtn").textContent = "★ Go VIP";
      return false;
    }
  } catch(e) {
    return false;
  }
}

function startWatchTimer() {
  stopWatchTimer();
  if (checkVipActive()) return;

  freeWatchTimer = setInterval(() => {
    let watched = parseInt(localStorage.getItem("mb_watched_seconds") || "0", 10);
    watched++;
    localStorage.setItem("mb_watched_seconds", String(watched));

    if (watched >= FREE_WATCH_LIMIT) {
      stopWatchTimer();
      closePlayer();
      openVip("Your 30-minute free trial has ended. Subscribe to a VIP Pass to continue watching!");
    }
  }, 1000);
}

function stopWatchTimer() {
  if (freeWatchTimer) {
    clearInterval(freeWatchTimer);
    freeWatchTimer = null;
  }
}

/* ---------- Downloads View ---------- */
function downloadView() {
  const m = $("#main");
  let raw = localStorage.getItem("mb_offline_downloads") || "[]";
  let list = [];
  try { list = JSON.parse(raw); } catch(e) {}

  m.innerHTML = `<h2>💾 Offline Saved Downloads (${list.length})</h2>
    <div id="dlGrid" class="grid"></div>`;

  const grid = $("#dlGrid");
  if (list.length === 0) {
    grid.innerHTML = `<p class="msg" style="grid-column:1/-1;padding:40px 0;text-align:center">No saved downloads yet. Tap "💾 Save Offline" inside any movie to watch offline anytime!</p>`;
    return;
  }

  grid.innerHTML = list.map(item => `
    <div class="card" onclick="quickPlay(${item.id},'${item.type}','${esc(item.title)}')">
      <img src="${item.poster}" alt="${esc(item.title)}">
      <div><b>${esc(item.title)}</b><br><small style="color:var(--pitch)">Downloaded 💾</small></div>
      <button onclick="event.stopPropagation();removeDownload(${item.id})" style="margin:8px;padding:4px 8px;border-radius:8px;background:#ff4d4d;color:#fff;border:0;cursor:pointer;font-size:11px">Delete</button>
    </div>
  `).join("");
}

function saveCurrentOffline() {
  if (!CUR || !CUR.id) return;
  try {
    let raw = localStorage.getItem("mb_offline_downloads") || "[]";
    let list = JSON.parse(raw);
    if (!list.some(x => x.id === CUR.id)) {
      list.push({
        id: CUR.id,
        type: CUR.type || "movie",
        title: CUR.title || "Movie",
        poster: poster(CUR.poster_path)
      });
      localStorage.setItem("mb_offline_downloads", JSON.stringify(list));
      alert(`📥 Saved "${CUR.title}" for offline viewing!`);
    } else {
      alert(`"${CUR.title}" is already in your offline downloads.`);
    }
  } catch(e) {}
}

function removeDownload(id) {
  try {
    let raw = localStorage.getItem("mb_offline_downloads") || "[]";
    let list = JSON.parse(raw).filter(x => x.id !== id);
    localStorage.setItem("mb_offline_downloads", JSON.stringify(list));
    downloadView();
  } catch(e) {}
}

let stkPollTimer = null;

function stopMpesaPolling() {
  if (stkPollTimer) {
    clearInterval(stkPollTimer);
    stkPollTimer = null;
  }
}

function startMpesaPolling(checkoutRequestId) {
  stopMpesaPolling();
  if (!checkoutRequestId) return;

  let attempts = 0;
  const maxAttempts = 20;

  stkPollTimer = setInterval(() => {
    attempts++;
    const pst = $("#pst");
    if (pst) pst.textContent = `⏳ Verifying payment with Safaricom (${attempts}/${maxAttempts})...`;

    const handleQueryResponse = (resStr) => {
      try {
        const res = typeof resStr === 'string' ? JSON.parse(resStr) : resStr;
        const resCode = String(res.ResultCode !== undefined ? res.ResultCode : (res.resultCode !== undefined ? res.resultCode : "1037"));

        if (resCode === "0") {
          stopMpesaPolling();
          const dur = PLAN_DURATIONS_MS[PLAN] || (7 * 24 * 3600 * 1000);
          const expiry = Date.now() + dur;
          localStorage.setItem("mb_vip_expiry", String(expiry));
          checkVipActive();
          const md = $("#modal");
          if (md) {
            md.innerHTML = `<div class="sheet" style="padding:40px 20px;text-align:center">
              <div style="font-size:48px;margin-bottom:12px">🎉</div>
              <h2 style="color:#00ff88;margin-bottom:8px">Payment Confirmed!</h2>
              <p style="color:var(--text);font-size:15px;margin-bottom:20px">Your VIP Pass has been successfully activated. Enjoy unlimited Ad-Free streaming!</p>
              <button class="play" onclick="closeM()" style="background:var(--pitch);color:#000">Start Watching Now ▶</button>
            </div>`;
          }
        } else if (resCode === "1" || resCode === "1032" || resCode === "1001") {
          stopMpesaPolling();
          const md = $("#modal");
          const reason = resCode === "1" ? "Insufficient M-Pesa Balance" : (resCode === "1032" ? "Payment Cancelled on Phone" : "Transaction Failed");
          if (md) {
            md.innerHTML = `<div class="sheet" style="padding:40px 20px;text-align:center">
              <div style="font-size:48px;margin-bottom:12px">❌</div>
              <h2 style="color:#ff4d4d;margin-bottom:8px">Payment Failed</h2>
              <p style="color:var(--text);font-size:14px;margin-bottom:20px">${esc(reason)}. VIP Pass was NOT activated.</p>
              <button class="vip" onclick="openVip()" style="background:var(--accent);color:#000">Try Again 🔄</button>
            </div>`;
          }
        }
      } catch(e) {}
    };

    window.onMpesaQueryResponse = handleQueryResponse;

    if (typeof AndroidKYC !== 'undefined' && AndroidKYC.queryMpesaSTKStatus) {
      AndroidKYC.queryMpesaSTKStatus(checkoutRequestId, "onMpesaQueryResponse");
    } else if (typeof AndroidMpesa !== 'undefined' && AndroidMpesa.queryMpesaSTKStatus) {
      AndroidMpesa.queryMpesaSTKStatus(checkoutRequestId, "onMpesaQueryResponse");
    }

    if (attempts >= maxAttempts) {
      stopMpesaPolling();
      const pst = $("#pst");
      if (pst) pst.textContent = "STK verification timed out. If money was deducted, click 'Go VIP' to retry.";
    }
  }, 3000);
}

window.onMpesaSTKResponse = function(responseStr) {
  try {
    const res = typeof responseStr === 'string' ? JSON.parse(responseStr) : responseStr;
    const code = String(res.ResponseCode !== undefined ? res.ResponseCode : (res.responseCode !== undefined ? res.responseCode : "1"));
    if (code === "0" || res.ResponseCode === "0") {
      const checkoutReqId = res.CheckoutRequestID || res.checkoutRequestID;
      startMpesaPolling(checkoutReqId);
    } else {
      const pst = $("#pst");
      if (pst) pst.textContent = "M-Pesa Error: " + (res.errorMessage || res.ResponseDescription || "Transaction rejected.");
    }
  } catch(e) {
    const pst = $("#pst");
    if (pst) pst.textContent = "M-Pesa processing error.";
  }
};
